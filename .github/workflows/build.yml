name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - id: set-targets
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import json
          import re

          targets = []
          with open("platformio.ini", encoding="utf-8") as platformio:
              for line in platformio:
                  match = re.match(r"\[env:([^\]]+)\]", line)
                  if not match:
                      continue
                  target = match.group(1)
                  if "simulator" in target or target.startswith("test_") or target.endswith("-test"):
                      continue
                  targets.append(target)

          print(f"targets={json.dumps(targets)}")
          PY

  build:
    needs: targets
    runs-on: ubuntu-24.04
    env:
      SKIP_TARGETS_CHECKOUT: "1"
    strategy:
      matrix:
        target: ${{fromJSON(needs.targets.outputs.targets)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.target }}-pip

      - name: Cache platformio
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ matrix.target }}-platformio

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install platformio
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build ${{ matrix.target }}
        run: |
          pio run -e ${{ matrix.target }}
          cp .pio/build/${{ matrix.target }}/firmware.hex  .pio/build/quicksilver.${{ matrix.target }}.hex

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: .pio/build/quicksilver.${{ matrix.target }}.hex

  upload:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: output

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk '
            $0 == "## " tag { in_section = 1; next }
            in_section && /^## / { exit }
            in_section && !seen_content && $0 == "" { next }
            in_section { seen_content = 1 }
            in_section { print }
          ' tag="${{ github.ref_name }}" CHANGELOG.md > RELEASE.md

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE.md
          files: output/*/quicksilver*.hex
